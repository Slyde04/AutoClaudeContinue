name: Build and publish Windows release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable app
        shell: pwsh
        run: ./build-legacy.ps1

      - name: Package release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $portableZip = "dist/AutoClaudeContinue-$version-windows-x64.zip"
          $sourceZip = "dist/AutoClaudeContinue-$version-source.zip"
          Compress-Archive -Path "dist/AutoClaudeContinue/*" -DestinationPath $portableZip -CompressionLevel Optimal
          git archive --format=zip --prefix="AutoClaudeContinue-$version-source/" --output=$sourceZip $env:GITHUB_REF_NAME
          $notes = @"
          **Windows portable app:** Extract the complete Windows ZIP and run `AutoClaudeContinue.exe`. Keep the `_internal` folder beside it.

          **Source code:** The second ZIP contains the tagged source tree.

          Licensed for noncommercial use only. See `LICENSE` in the source ZIP.
          "@
          gh release create $env:GITHUB_REF_NAME $portableZip $sourceZip --title "AutoClaudeContinue $version" --notes $notes
        env:
          GH_TOKEN: ${{ github.token }}
